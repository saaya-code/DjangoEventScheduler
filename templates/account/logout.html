{% extends "base.html" %}

{% block title %}Sign Out{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white rounded-lg shadow-md overflow-hidden mt-8">
  <div class="bg-blue-700 text-white p-6">
    <h1 class="text-2xl font-bold">Sign Out</h1>
  </div>
  
  <div class="p-6">
    <p class="mb-4">Are you sure you want to sign out?</p>

    <form method="post" action="{% url 'account_logout' %}">
      {% csrf_token %}
      {% if redirect_field_value %}
      <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}"/>
      {% endif %}
      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-md transition">
        Sign Out
      </button>
    </form>
  </div>
</div>
{% endblock %}
