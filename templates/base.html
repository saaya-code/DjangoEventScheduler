<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Event Manager{% endblock %}</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles can be added here */
        .fade-in {
            animation: fadeIn ease 0.5s;
        }
        @keyframes fadeIn {
            0% {opacity: 0;}
            100% {opacity: 1;}
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    <header class="bg-blue-700 text-white shadow-lg">
        <nav class="container mx-auto px-4 py-4 flex justify-between items-center">
            <a href="{% url 'event-list' %}" class="text-xl font-bold">Event Manager</a>
            <div class="space-x-4">
                <a href="{% url 'event-list' %}" class="hover:text-blue-200 transition duration-300">Events</a>
                <a href="{% url 'admin:index' %}" class="hover:text-blue-200 transition duration-300">Admin</a>
            </div>
        </nav>
    </header>

    <main class="container mx-auto px-4 py-8 flex-grow">
        {% if messages %}
        <div class="mb-6">
            {% for message in messages %}
            <div class="fade-in {% if message.tags == 'error' %}bg-red-100 border-l-4 border-red-500 text-red-700{% else %}bg-green-100 border-l-4 border-green-500 text-green-700{% endif %} p-4 mb-2" role="alert">
                <p>{{ message }}</p>
            </div>
            {% endfor %}
        </div>
        {% endif %}

        {% block content %}
        {% endblock %}
    </main>

    <footer class="bg-gray-800 text-white py-6 mt-auto">
        <div class="container mx-auto px-4">
            <p class="text-center">&copy; {% now "Y" %} Event Manager. All rights reserved.</p>
        </div>
    </footer>

    {% block extra_js %}{% endblock %}
</body>
</html>
